# Configuration Nginx CORRIGÉE pour api.indebel.be
# À copier dans Plesk → api.indebel.be → Paramètres Apache & nginx → Directives nginx supplémentaires

# Headers CORS pour toutes les réponses
more_set_headers 'Access-Control-Allow-Origin: https://pro.indebel.be';
more_set_headers 'Access-Control-Allow-Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS';
more_set_headers 'Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With, Accept';
more_set_headers 'Access-Control-Allow-Credentials: true';

# Gérer les requêtes OPTIONS spécifiquement
if ($request_method = 'OPTIONS') {
    return 204;
}
