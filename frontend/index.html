<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0066cc" />
    <meta name="description" content="Indebel - La mise en relation 100% belge pour connecter freelancers et entreprises" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Indebel" />
    
    <title>Indebel - La mise en relation 100% belge</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Debug script pour diagnostiquer les problèmes d'authentification -->
    <script src="/auth-debug.js"></script>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration (désactivé en développement) -->
    <script>
      // Détecter si nous sommes en développement (localhost)
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      
      if ('serviceWorker' in navigator && !isDevelopment) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ Service Worker enregistré avec succès:', registration.scope);
            })
            .catch(error => {
              console.log('❌ Échec de l\'enregistrement du Service Worker:', error);
            });
        });
      } else if ('serviceWorker' in navigator) {
        // Désinscrire le service worker en développement s'il existe
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        });
        console.log('🔧 Service Worker désactivé en développement');
      }
    </script>
  </body>
</html>
