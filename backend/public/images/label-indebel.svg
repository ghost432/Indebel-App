<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="15" ry="15" filter="url(#shadow)"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="10" ry="10"/>
  
  <!-- Crown Icon -->
  <g transform="translate(200, 60)">
    <path d="M-20,-10 L-10,-20 L0,-15 L10,-20 L20,-10 L15,5 L-15,5 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <circle cx="-10" cy="-15" r="3" fill="#FF6B6B"/>
    <circle cx="0" cy="-20" r="3" fill="#4ECDC4"/>
    <circle cx="10" cy="-15" r="3" fill="#FF6B6B"/>
  </g>
  
  <!-- Main Text -->
  <text x="200" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">LABEL</text>
  <text x="200" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">INDEBEL</text>
  
  <!-- Subtitle -->
  <text x="200" y="180" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="14">Certification d'Excellence</text>
  
  <!-- Badge Elements -->
  <circle cx="60" cy="80" r="8" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="80" r="8" fill="rgba(255,255,255,0.2)"/>
  <circle cx="60" cy="220" r="8" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="220" r="8" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Year -->
  <text x="200" y="240" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">2025</text>
  
  <!-- Footer -->
  <text x="200" y="270" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="12">pro.indebel.be</text>
</svg>
